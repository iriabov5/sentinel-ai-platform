micronaut:
  application:
    name: behavior-analysis-service
  server:
    port: ${BEHAVIOR_ANALYSIS_SERVICE_PORT:8082}

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mongodb:
  uri: ${MONGODB_URI:mongodb://localhost:27017/behavior_analysis}

sentinel:
  kafka:
    topics:
      raw: ${KAFKA_TOPIC_SECURITY_EVENTS_RAW:security.events.raw}
      dlq: ${KAFKA_TOPIC_SECURITY_EVENTS_RAW_DLQ:security.events.raw.dlq}
    processing-retries: ${BEHAVIOR_ANALYSIS_KAFKA_PROCESSING_RETRIES:3}
  mongodb:
    database: ${MONGODB_DATABASE:behavior_analysis}
    collection: ${MONGODB_EVENT_HISTORY_COLLECTION:event_history}

endpoints:
  health:
    enabled: true
    sensitive: false
